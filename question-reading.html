<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>질문하는 독서의 힘 · 독서모임 발표</title>
<meta property="og:title" content="질문하는 독서의 힘 · 독서모임 발표">
<meta property="og:description" content="1~4장 요약 · 자유 논제와 선택 논제 · 『살면서 한번은 벽돌책』 논제 예시">
<meta property="og:image" content="https://outis-books.github.io/bookclub/question-reading/s01.jpg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: #FFF3F0; color: #3A2E2A; -webkit-font-smoothing: antialiased; }
.page { max-width: 960px; margin: 0 auto; padding: 36px 16px 64px; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #D9594C; margin-bottom: 8px; }
h1 { font-size: 26px; font-weight: 700; line-height: 1.35; margin-bottom: 6px; }
.lede { font-size: 14px; color: #6B5A54; margin-bottom: 20px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
.btn { display: inline-block; text-decoration: none; font-size: 14px; font-weight: 700; padding: 10px 18px; border-radius: 100px; background: #D9594C; color: #fff; }
.btn.sub { background: #fff; color: #D9594C; border: 1.5px solid #F4A79D; }
figure { margin: 0 0 18px; }
figure img { display: block; width: 100%; height: auto; border-radius: 10px; box-shadow: 0 2px 10px rgba(58,46,42,.10); background: #fff; }
figcaption { font-size: 12px; color: #9a8a84; text-align: right; margin-top: 6px; }
.foot { font-size: 12px; color: #9a8a84; line-height: 1.8; margin-top: 30px; }
</style>
</head>
<body>
<div class="page">
  <div class="kicker">우티스의 북살롱 · 독서모임 발표</div>
  <h1>질문하는 독서의 힘</h1>
  <p class="lede">김민영 · 권선영 · 윤석윤 · 장정윤 지음 · 북바이북</p>
  <div class="btns">
    <a class="btn" href="question-reading/question-reading.pdf">PDF로 보기</a>
    <a class="btn sub" href="question-reading/question-reading.pptx">PPT 내려받기</a>
  </div>
  <div id="slides"></div>
  <p class="foot">발췌문과 표의 출처는 슬라이드마다 쪽수로 밝혔습니다. 모임 안에서만 나누어 주세요.</p>
</div>
<script>
const N = 15, box = document.getElementById('slides');
for (let i = 1; i <= N; i++) {
  const n = String(i).padStart(2, '0');
  box.insertAdjacentHTML('beforeend',
    `<figure><img src="question-reading/s${n}.jpg?v=3" alt="슬라이드 ${i}" loading="${i > 2 ? 'lazy' : 'eager'}"><figcaption>${i} / ${N}</figcaption></figure>`);
}
</script>
</body>
</html>
